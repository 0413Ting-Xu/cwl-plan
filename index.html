<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>聯賽分配</title>
<link rel="icon" href="img/etc-96.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/etc-180.png">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Russo+One&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 聯賽分配（2026-11-15，筆記/聯賽分配.md）。顏色跟統計頁同一套名字 */
:root{
  --ink:#11141d; --s1:#1a1f2e; --s2:#232a3b; --s3:#2c3446;
  --line:#333c52; --line2:#455170;
  --tx:#e9ecf4; --tx2:#9aa3bb; --tx3:#6b748d; --tx4:#555c70;
  --soft:#8e9ce6; --good:#6fbf8b; --warm:#d6a05f; --loss:#d9584e; --pick:#6d7cf5;
  --steel:#9fb6d6; --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--tx);font-family:Rubik,'Noto Sans TC',-apple-system,sans-serif;font-size:15px}
body{min-height:100vh;padding:0 0 80px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;font-size:16px;color:var(--tx);background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;width:100%}
input:focus{border-color:var(--line2)}
.cp-wrap{max-width:760px;margin:0 auto;padding:0 16px}
.cp-top{position:sticky;top:0;z-index:20;background:rgba(17,20,29,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.cp-hd{display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.cp-ttl{font-weight:700;font-size:18px;letter-spacing:.5px;flex:1;min-width:0}
.cp-mon{display:flex;align-items:center;gap:2px;font-weight:600;color:var(--tx2)}
.cp-mon button{width:30px;height:30px;border-radius:8px;color:var(--tx3);font-size:18px}
.cp-mon b{min-width:62px;text-align:center;color:var(--tx);font-weight:600}
.cp-tabs{display:flex;gap:4px;padding-bottom:8px}
.cp-tab{flex:1;padding:8px 0;border-radius:8px;color:var(--tx3);font-weight:600;font-size:14px;position:relative}
.cp-tab.on{background:var(--s2);color:var(--tx)}
.cp-dot{display:inline-block;min-width:18px;height:18px;line-height:18px;padding:0 5px;border-radius:9px;background:var(--loss);color:#fff;font-size:11px;margin-left:5px;vertical-align:1px}
.cp-sv{font-size:12px;color:var(--tx3);min-width:44px;text-align:right}
.cp-sv.bad{color:var(--loss)}
.cp-bar{margin:12px 0 0;padding:10px 12px;border-radius:var(--r);background:rgba(217,88,78,.12);border:1px solid rgba(217,88,78,.4);color:#f0b3ad;font-size:14px;display:flex;gap:10px;align-items:center}
.cp-bar button{margin-left:auto;padding:6px 10px;border-radius:8px;background:var(--s3);color:var(--tx);font-size:13px;white-space:nowrap}
.cp-ov{margin:14px 0 4px;padding:4px 0;background:linear-gradient(180deg,#1f2535,#191e2c);border:1px solid #2a3248;border-radius:14px;display:grid;grid-template-columns:1fr}
.cp-ovr{display:flex;align-items:center;gap:10px;width:100%;padding:7px 14px;text-align:left;font-size:14px}
.cp-ovr img{width:22px;height:22px;object-fit:contain;flex:none}
.cp-ovr .nm{flex:1;min-width:0;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-ovr .cp-cnt{font-size:14px}
.cp-ovr.un{border-top:1px solid #2a3248;margin-top:4px;padding-top:10px}
.cp-ovr.un .nm{color:var(--tx3)}
.cp-ovr.un i{width:22px;flex:none}
@media(min-width:640px){.cp-ov{grid-template-columns:1fr 1fr;column-gap:8px}.cp-ovr.un{grid-column:1/-1}}
.cp-card{scroll-margin-top:110px}
.cp-sha{margin-top:10px;gap:8px;flex-wrap:wrap}
.cp-tg{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--tx2);padding:6px 2px}
.cp-tg i{width:34px;height:20px;border-radius:10px;background:var(--s3);position:relative;flex:none}
.cp-tg i::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--tx3);transition:transform .15s}
.cp-tg.on i{background:#33406e}.cp-tg.on i::after{transform:translateX(14px);background:#dfe4ff}
.cp-shl{display:flex;flex-direction:column;align-items:center;gap:18px;padding:16px 16px 40px}
.cp-shi{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:420px}
.cp-shi img{width:100%;border-radius:12px;border:1px solid #2a3248}
/* 產圖用（畫面外）：直式 420 寬、30 人的部落 640 寬兩欄。WebKit 產圖 grid 裡有圖會撐高 → 全用 flex；不用 box-shadow */
.cp-img{position:fixed;left:-10000px;top:0;width:420px;display:flex;flex-direction:column;gap:12px;padding:22px 20px 16px;background:#0b1221;color:var(--tx);font-family:Rubik,'Noto Sans TC',sans-serif}
.cp-img.wide{width:640px}
.ci-hd{display:flex;align-items:center;gap:14px;padding:4px 4px 14px;border-bottom:1px solid #2a3248}
.ci-bd{width:64px;height:64px;object-fit:contain;flex:none}
.ci-ht{display:flex;flex-direction:column;gap:3px;min-width:0}
.ci-mo{font-size:13px;color:#93a3c4;letter-spacing:1px}
.ci-ht b{font-size:23px;font-weight:700;color:#fff;line-height:1.25}
.ci-lg{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:#9aa3bb}
.ci-lg span{display:flex;align-items:center;gap:5px}
.ci-lg img{width:22px;height:22px;object-fit:contain}
.ci-lg i{font-style:normal;color:#555c70}
.ci-ls{display:flex;flex-direction:column;gap:6px}
.ci-ls.two{flex-direction:row;flex-wrap:wrap;gap:6px 10px}
.ci-ls.two .ci-r{width:calc(50% - 5px)}
.ci-r{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px;background:linear-gradient(180deg,#1f2535,#191e2c);border:1px solid #2a3248}
.ci-n{width:20px;text-align:right;font-family:'Russo One',Rubik,sans-serif;font-size:14px;color:#6b748d;flex:none}
.ci-w{flex:1;min-width:0;display:flex;flex-direction:column}
.ci-w b{font-size:16px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-w small{font-size:12px;color:#93a3c4;margin-top:1px}
.ci-r .ficw{--ic:30px}
.ci-sub{font-size:13px;font-weight:600;color:#93a3c4;letter-spacing:1px;margin:4px 0 -4px 4px}
.ci-ft{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#93a3c4;padding-top:6px}
.ci-ft span{display:flex;align-items:center;gap:6px}
.ci-ft img{width:26px;height:26px}
.ci-lgl{font-family:Rubik,sans-serif;font-size:9px;color:#55607a;text-align:center}
.cp-cfs{display:flex;flex-wrap:wrap;gap:8px 14px;padding:10px 14px;border-bottom:1px solid #2a3248;background:rgba(15,19,32,.35)}
.cp-cfs span{display:flex;align-items:center;gap:5px}
.cp-cfs .ficw{--ic:24px}
.cp-cfs b{font-family:'Russo One',Rubik,sans-serif;font-weight:400;font-size:14px;color:var(--tx)}
/* 三星率紅綠分段（11/16 他選甲：推翻「工具不下結論」，這頁給首領挑人用） */
.cp-r.hi{color:var(--good)}.cp-r.lo{color:var(--loss)}
.cp-sp{flex:1}
.cp-acts{display:flex;gap:8px;margin:10px 0 2px;flex-wrap:wrap}
.cp-btn{padding:9px 14px;border-radius:8px;background:var(--s2);border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--tx)}
.cp-btn.pri{background:#2b3560;border-color:#46528a;color:#dfe4ff}
.cp-btn.sm{padding:6px 10px;font-size:13px}
.cp-btn:disabled{opacity:.4}
.cp-card{margin:14px 0;background:var(--s1);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cp-ch{display:flex;align-items:center;gap:10px;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.cp-ch img{width:34px;height:34px;flex:none}
.cp-cn{flex:1;min-width:0}
.cp-cn b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-cn>span{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--tx3);margin-top:3px;white-space:nowrap}
.cp-cnt{font-weight:600;font-size:15px;color:var(--tx2);white-space:nowrap}
.cp-cnt.full{color:var(--good)}
.cp-cnt.over{color:var(--warm)}
.cp-ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--tx3);flex:none}
.cp-ic:active{background:var(--s2)}
.cp-ic svg{width:18px;height:18px}
.cp-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid rgba(51,60,82,.55)}
.cp-row:first-child{border-top:0}
.cp-n{width:22px;text-align:right;color:var(--tx4);font-size:13px;flex:none;font-variant-numeric:tabular-nums}
.cp-who{flex:1;min-width:0}
.cp-gn{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-gn em{font-style:normal;color:var(--tx3);font-weight:400;font-size:13px;margin-left:6px}
.cp-st{font-size:12.5px;color:var(--tx3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-st .l1{color:var(--steel)}
.cp-th{font-size:11px;color:var(--tx3);border:1px solid var(--line);border-radius:5px;padding:1px 4px;margin-right:6px;font-variant-numeric:tabular-nums}
.cp-th.low{color:var(--warm);border-color:rgba(214,160,95,.5)}
.cp-sub{padding:7px 12px 5px;font-size:12px;color:var(--tx3);background:rgba(0,0,0,.12);border-top:1px solid var(--line)}
.cp-add{display:block;width:100%;padding:11px 12px;text-align:left;color:var(--soft);font-weight:500;border-top:1px solid var(--line)}
/* 到齊了沒（11/25）：總覽沿用分配頁那張；卡片右上大數字＝已到／排了幾個（主力），全部到齊變綠 */
.cp-dqv{margin:14px 0 4px;padding:4px 0;background:linear-gradient(180deg,#1f2535,#191e2c);border:1px solid #2a3248;border-radius:14px}
.cp-dqvr{display:flex;flex-wrap:wrap;align-items:center;gap:11px;width:100%;padding:11px 14px;text-align:left}
.cp-dqvr+.cp-dqvr{border-top:1px solid rgba(51,60,82,.55)}
.cp-dqvr:active{transform:scale(.985)}
.cp-dqvr>img,.cp-dqvr>i{width:30px;height:30px;flex:none;object-fit:contain}
.cp-dqvr .nm{flex:1;min-width:0;font-size:15px;font-weight:500;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-dqvr .ct{display:flex;align-items:center;gap:8px;flex:none}
.cp-dqvr .bar{flex:none;width:calc(100% - 41px);margin:-3px 0 0 41px;height:6px;border-radius:3px;background:#2a3248;overflow:hidden}
.cp-dqvr .bar b{display:block;height:100%;border-radius:3px;background:#ef7d72}
.cp-dqvr.ok .bar b{background:var(--good)}
.cp-dqv .n{font-family:'Russo One',Rubik,sans-serif;font-size:20px;line-height:1;white-space:nowrap}
.cp-dqv .n small{font-size:13px;color:var(--tx3);margin-left:1px}
.cp-dqv .ng .n{color:#ef7d72}
.cp-dqv .ok .n{color:var(--good)}
/* 到齊特效（11/25 他：「全員到齊的話再幫我加上一個持續跑動的好看的特效」→ 三種裡挑乙 呼吸光）：整個部落到齊的那條和數字一亮一暗；手機開「減少動態」就不動 */
.cp-dqvr.ok .bar{overflow:visible}
.cp-dqvr.ok .bar b{animation:cpBreath 2.2s ease-in-out infinite}
.cp-dqvr.ok .n{animation:cpGlowN 2.2s ease-in-out infinite}
@keyframes cpBreath{0%,100%{box-shadow:0 0 0 rgba(111,191,139,0);filter:brightness(1)}50%{box-shadow:0 0 12px 1px rgba(111,191,139,.95);filter:brightness(1.4)}}
@keyframes cpGlowN{0%,100%{text-shadow:0 0 0 rgba(111,191,139,0)}50%{text-shadow:0 0 12px rgba(111,191,139,.9)}}
@media (prefers-reduced-motion:reduce){.cp-dqv .bar b,.cp-dqv .n{animation:none!important}}
.cp-dqb{font-size:12px;font-weight:600;line-height:1.4;color:#f0a49c;border:1px solid rgba(239,125,114,.45);border-radius:6px;padding:1px 6px;white-space:nowrap}
.cp-dqb.ok{color:var(--good);border-color:rgba(111,191,139,.45)}
.cp-dqs{font-size:13px;font-weight:600;color:#c9cfdd;padding:8px 12px 6px}
.cp-dqs.ng{color:#f0a49c}
.cp-dqn.ng{color:#ef7d72}
.cp-dqa{align-items:center}
.cp-dqt{margin-left:auto;font-size:12.5px;color:var(--tx3);white-space:nowrap}
.cp-dqt.old{color:var(--loss)}
.cp-dqt.busy{color:var(--soft)}
.cp-dqr{display:flex;align-items:center;gap:5px;padding:9px 12px}
.cp-dqr svg{width:15px;height:15px}
.cp-dqr.busy svg{animation:cpSpin .8s linear infinite}
@keyframes cpSpin{to{transform:rotate(360deg)}}
.cp-dqc.ok{border-color:rgba(111,191,139,.45)}
.cp-dqn{font-family:'Russo One',Rubik,sans-serif;font-size:22px;color:var(--tx);white-space:nowrap;line-height:1}
.cp-dqn small{font-size:14px;color:var(--tx3);margin-left:1px}
.cp-dqn.ok{color:var(--good)}
.cp-dqg{color:var(--warm)}
.cp-dqw{flex:none;max-width:50%;font-size:12.5px;color:var(--tx2);background:var(--s2);border:1px solid var(--line);border-radius:7px;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-dqw.wr{color:var(--warm);border-color:rgba(214,160,95,.45);background:rgba(214,160,95,.08)}
.cp-dqw.no{color:#f0b3ad;border-color:rgba(217,88,78,.45);background:rgba(217,88,78,.08)}
.cp-st .k{color:var(--tx4);margin-right:5px}
.cp-dqok{display:flex;align-items:center;gap:6px;padding:11px 12px;color:var(--good);font-size:14px;font-weight:500}
.cp-dqok svg{width:16px;height:16px}
.cp-dqo{display:flex;align-items:center;gap:6px;width:100%;padding:10px 12px;border-top:1px solid var(--line);color:var(--tx3);font-size:13.5px;text-align:left}
.cp-dqo:active{transform:scale(.985)}
.cp-dqo svg{width:16px;height:16px;transition:transform .15s}
.cp-dqo.on svg{transform:rotate(180deg)}
.cp-dql{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.cp-dql span{font-size:13px;color:var(--tx2);background:var(--s2);border-radius:6px;padding:3px 8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-det{padding:4px 12px 10px 44px;font-size:12.5px;color:var(--tx2)}
.cp-det table{border-collapse:collapse;width:100%}
.cp-det td{padding:3px 6px 3px 0;white-space:nowrap}
.cp-det td.r{text-align:right;font-variant-numeric:tabular-nums}
.cp-det .mute{color:var(--tx3)}
.cp-empty{padding:14px 12px;color:var(--tx3);font-size:14px}
/* 選人 */
.cp-sheet{position:fixed;inset:0;z-index:50;background:var(--ink);display:flex;flex-direction:column}
.cp-sh{padding:10px 16px 8px;border-bottom:1px solid var(--line);background:var(--ink)}
.cp-shr{display:flex;align-items:center;gap:8px;max-width:760px;margin:0 auto}
.cp-sht{flex:1;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-flt{display:flex;gap:6px;max-width:760px;margin:8px auto 0}
.cp-flt button{padding:6px 11px;border-radius:8px;font-size:13px;color:var(--tx3);border:1px solid var(--line)}
.cp-sws{display:flex;gap:6px;max-width:760px;margin:8px auto 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.cp-sws::-webkit-scrollbar{display:none}
.cp-sws button{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px 6px 7px;border-radius:10px;border:1px solid #2a3248;background:linear-gradient(180deg,#1f2535,#191e2c);font-size:13px;color:var(--tx2)}
.cp-sws button img{width:20px;height:20px;object-fit:contain}
.cp-sws button span{max-width:7.5em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-sws button .cp-cnt{font-size:12.5px}
.cp-sws button.on{color:#fff;background:linear-gradient(180deg,#334252,#222b36);border-color:rgba(150,178,206,.6)}
/* 電腦（滑鼠）沒辦法左右滑：部落和流派那兩排改成排不下就換行（11/16 他：電腦版不能滑動） */
@media (hover:hover) and (pointer:fine){.cp-sws,.cp-ffl{flex-wrap:wrap;overflow:visible}}
.cp-ffl{display:flex;align-items:center;gap:6px;max-width:760px;margin:8px auto 0;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 4px;scrollbar-width:none}
.cp-ffl::-webkit-scrollbar{display:none}
.cp-ffk{flex:none;font-size:13px;color:var(--tx3);margin-right:2px}
/* 每一顆像一塊可以按的小磚：底色＋外框，按下去變藍、右上打勾（11/16 他：看不出來可以點） */
.cp-ffl button{position:relative;flex:none;display:flex;align-items:center;gap:5px;padding:5px 9px 5px 6px;border-radius:10px;background:var(--s2);border:1px solid var(--line);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 2px 4px rgba(0,0,0,.25)}
.cp-ffl button:active{transform:translateY(1px)}
.cp-ffl button .ficw{--ic:24px}
.cp-ffl button small{font-size:12.5px;color:var(--tx2);font-family:'Russo One',Rubik,sans-serif}
.cp-ffl button.on{background:#2b3560;border-color:#7d8cf0}
.cp-ffl button.on small{color:#fff}
.cp-ffc{position:absolute;top:-6px;right:-5px;width:16px;height:16px;border-radius:50%;background:#7d8cf0;color:#11141d;font:700 10px/16px Rubik,sans-serif;text-align:center}
.cp-ffl button.clr{padding:7px 11px;font-size:13px;color:var(--tx2);background:transparent}
.cp-flt button.on{color:var(--tx);background:var(--s2);border-color:var(--line2)}
.cp-sl{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cp-sl>div{max-width:760px;margin:0 auto}
.cp-pk{display:flex;align-items:center;gap:10px;width:100%;padding:10px 16px;text-align:left;border-bottom:1px solid rgba(51,60,82,.55)}
.cp-pk:active{background:var(--s1)}
.cp-pk .cp-where{font-size:12px;color:var(--tx3);white-space:nowrap}
.cp-pk .cp-where.here{color:var(--good)}
/* 名冊 */
.cp-srch{margin:14px 0 6px}
.cp-h2{margin:18px 0 6px;font-size:13px;color:var(--tx3);font-weight:600;letter-spacing:.5px}
.cp-pp{border-top:1px solid rgba(51,60,82,.55)}
.cp-pp:first-child{border-top:0}
.cp-ph{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;text-align:left}
.cp-ph .cp-who b{font-weight:500}
.cp-ph .cp-who>span{display:block;font-size:12.5px;color:var(--tx3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-pc{color:var(--tx3);font-size:13px;white-space:nowrap}
.cp-pb{padding:2px 12px 12px}
.cp-fr{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;margin:8px 0}
.cp-fr label{font-size:13px;color:var(--tx3)}
.cp-ar{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid rgba(51,60,82,.4)}
.cp-in{display:flex;gap:8px;margin-top:8px}
.cp-in input{flex:1;min-width:0}
.cp-q{padding:11px 12px;border-top:1px solid rgba(51,60,82,.55)}
.cp-q:first-child{border-top:0}
.cp-qt{font-size:14px}
.cp-qt b{font-weight:600}

function shareGen(){

  var k=0,next=function(){
    if(sh.tok!==tok||UI.share!==sh)return;

    var c=shareCard(L[k],sh.fl),w=document.createElement('div');w.className='cp-img'+(c.wide?' wide':'');w.innerHTML=c.html;document.body.appendChild(w);
    var wait=[].map.call(w.querySelectorAll('img'),function(im){return im.complete?null:new Promise(function(ok){im.onload=im.onerror=ok})}).filter(Boolean);
    Promise.all(wait).then(function(){return html2canvas(w,{backgroundColor:'#0b1221',scale:3,useCORS:true})}).then(function(cv){
      return new Promise(function(ok,no){cv.toBlob(function(b){b?ok(b):no(new Error('blob'))},'image/png')})}).then(function(b){
      w.remove();if(sh.tok!==tok)return;sh.imgs[k]=new File([b],c.name,{type:'image/png'});sh.urls[k]=URL.createObjectURL(b);k++;drawShare();next()},
      function(){w.remove();k++;next()});

/* ======== 開始 ======== */
function boot(){
  /* 載入畫面：ETC 隊徽一亮一暗＋幾張灰色的卡（形狀跟殼子卡一樣），資料到了直接換成真的、淡入 */
  var sk=function(n){var h='<div class="cp-sk"><div class="cp-skh"><b></b><i></i></div>';for(var k=0;k<n;k++)h+='<i></i>';return h+'</div>'};
  $('cpApp').innerHTML='<div class="cp-ld"><img class="cp-ldl" src="img/etc-96.png" alt=""><div class="cp-wrap">'+sk(4)+sk(3)+sk(3)+'</div></div>';
  loadAll().then(function(){NEED.at=P.at||'';draw();cpFadeIn();needCheck();if(UI.tab==='who')whoAuto()}).catch(function(){$('cpApp').innerHTML='<div class="cp-wrap"><div class="cp-bar" style="margin-top:30vh">讀不到資料<button data-act="reload">再試一次</button></div></div>'});
}
function gate(){
  var ok=false;try{ok=localStorage.getItem('cpl_pass')===CP_PASS}catch(e){}
  if(ok||CP_PV&&CP_PV.nogate){boot();return}
  $('cpApp').innerHTML='<div class="cp-gate"><h1>聯賽分配</h1><input id="cpPw" type="password" inputmode="numeric" placeholder="密碼" autocomplete="off"><p id="cpPwE"></p></div>';
  $('cpPw').addEventListener('keydown',function(e){
    if(e.key!=='Enter')return;
    if(this.value===CP_PASS){try{localStorage.setItem('cpl_pass',CP_PASS)}catch(x){}boot()}else $('cpPwE').textContent='密碼不對';
  });
  $('cpPw').addEventListener('input',function(){if(this.value===CP_PASS){try{localStorage.setItem('cpl_pass',CP_PASS)}catch(x){}boot()}});
}
UI.mon=monDef();
if(location.hash==='#who')UI.tab='who';
document.addEventListener('click',act);
document.addEventListener('change',onChange);
document.addEventListener('input',onInput);
function cpFadeIn(){var a=$('cpApp');a.classList.remove('cp-fi');void a.offsetWidth;a.classList.add('cp-fi');setTimeout(function(){a.classList.remove('cp-fi')},450)}
/* 按鈕手感（UX 11/25）：亮的那格是一塊另外的底（cp-ind），每次重畫從上一次的位置滑到新的位置 */
var SEG_POS={};
function segSlide(){[].forEach.call(document.querySelectorAll('[data-sk]'),function(g){
  var on=g.querySelector(':scope>button.on');if(!on)return;
  var k=g.getAttribute('data-sk'),ind=g.querySelector(':scope>.cp-ind');if(!ind){ind=document.createElement('i');ind.className='cp-ind';g.insertBefore(ind,g.firstChild)}
  var to=[on.offsetLeft,on.offsetWidth],fr=SEG_POS[k]||to;SEG_POS[k]=to;
  ind.style.transition='none';ind.style.transform='translateX('+fr[0]+'px)';ind.style.width=fr[1]+'px';g.classList.add('sl');
  void ind.offsetWidth;ind.style.transition='';ind.style.transform='translateX('+to[0]+'px)';ind.style.width=to[1]+'px';})}
draw=(function(o){return function(){o.apply(this,arguments);segSlide()}})(draw);
document.addEventListener('touchstart',function(){},{passive:true});   /* iOS 要有這行，按下去的樣子（:active）才會出現 */
/* 加人回饋（UX 11/25）：記住上一次畫出來的人數，有變的那幾個數字跳一下（總覽、卡片、加人畫面上面那排），剛好排滿再閃綠色。
   分配頁跟加人畫面各記各的：在加人畫面加完，關掉回到分配頁時，那幾張卡的人數會再跳一次 */
var CNT_LAST={main:null,sheet:null};
function cntSnap(){var o={};if(PL)PL.sh.forEach(function(s){o[s.t]=[s.a.length,s.size]});return o}
function cntBump(w){
  var now=cntSnap(),last=CNT_LAST[w];CNT_LAST[w]=now;if(!last)return;
  Object.keys(now).forEach(function(t){var a=now[t],b=last[t];if(!b||a[0]===b[0])return;var full=a[0]===a[1]&&b[0]<a[1];
    var q=w==='sheet'?['#cpSW [data-to="'+t+'"] .cp-cnt']:['[data-go="'+t+'"] .cp-cnt','#cpc_'+t.slice(1)+' .cp-ch .cp-cnt'];
    q.forEach(function(sel){[].forEach.call(document.querySelectorAll(sel),function(e){e.classList.remove('cp-bump','cp-fullfx');void e.offsetWidth;e.classList.add(full?'cp-fullfx':'cp-bump')})});
    if(full&&w==='sheet'){var bt=document.querySelector('#cpSW [data-to="'+t+'"]');if(bt){bt.classList.remove('cp-fullbtn');void bt.offsetWidth;bt.classList.add('cp-fullbtn')}}});
}
draw=(function(o){return function(){o.apply(this,arguments);cntBump('main')}})(draw);
drawSheet=(function(o){return function(){o.apply(this,arguments);if(UI.sheet)cntBump('sheet');else CNT_LAST.sheet=null}})(drawSheet);
gate();
</script>
</body>
</html>
